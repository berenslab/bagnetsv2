[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bagnetsv2"
version = "0.1.0"
description = "Updated pytorch implementation of the bag-of-local-feature models (BagNets)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "opencv-python",
    "pillow",
    "scikit-learn",
    "scikit-image",
    "scipy",
    "imblearn",
    "pandas",
    "matplotlib",
    "seaborn",
    "glasbey",
    "fundus_image_toolbox",
    "opentsne",
    "umap-learn",
    "hydra-core>=1.3.2",
    "wandb>=0.25.1",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
